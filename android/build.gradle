// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        kotlinVersion = "1.7.10"
        androidXAnnotation = "1.8.0"


        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
    
    // Fix Kotlin version conflicts by forcing same version for all Kotlin modules
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.7.10"
            // Force compatible AndroidX versions for AGP 7.4.2
            force "androidx.webkit:webkit:1.7.0"
            force "androidx.core:core-ktx:1.10.1"
            force "androidx.core:core:1.10.1"
            force "androidx.activity:activity:1.7.2"
            force "androidx.core:core-viewtree:1.0.0-alpha02"
            force "androidx.profileinstaller:profileinstaller:1.3.1"
            force "androidx.exifinterface:exifinterface:1.3.6"
        }
    }
    
    // Enable BuildConfig for all Android projects to fix compatibility with AGP 8.x
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildFeatures {
                    buildConfig true
                }
            }
        }
    }
}
